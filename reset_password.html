<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;background:#050816;color:#fff;font:16px Arial,sans-serif}.card{width:min(100%,390px);padding:30px;background:#121827;border:1px solid #7c3aed;border-radius:20px;text-align:center}h1{color:#c084fc;font-size:25px}p{color:#aab4c5;line-height:1.5}input,button{width:100%;padding:13px;margin:8px 0;border:0;border-radius:10px}input{background:#1f2937;color:#fff}button{background:linear-gradient(135deg,#7c3aed,#c084fc);color:#fff;font-weight:bold}button:disabled{opacity:.5}.message{padding:10px;border-radius:8px}.error{color:#ff7185;background:#ff4d6d20}.success{color:#00f5a0;background:#00f5a020}a{color:#c084fc}form[hidden]{display:none}</style></head><body><main class="card"><h1>Reset Password</h1><p id="status">Checking your reset link…</p><form id="form" hidden><input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="New password (at least 6 characters)" required><input id="confirm" type="password" minlength="6" autocomplete="new-password" placeholder="Confirm new password" required><button id="submit" type="submit">Update Password</button></form><div id="message"></div><p><a href="login.html">← Back to Login</a></p></main><script>
const API="https://ai-trading-system-j5jf.onrender.com", token=new URLSearchParams(location.search).get("token"), statusEl=document.getElementById("status"), form=document.getElementById("form"), msg=document.getElementById("message");
(async()=>{if(!token){statusEl.textContent="This reset link is missing its token. Request a new one.";return}try{const r=await fetch(API+"/api/verify-reset-token?token="+encodeURIComponent(token)),d=await r.json();if(!r.ok||!d.success){statusEl.textContent=d.message||"This link is invalid or expired. Request a new one.";return}statusEl.textContent="Choose a new password for your account.";form.hidden=false}catch(e){statusEl.textContent="Could not verify this link. Please try again."}})();
form.addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("submit"),newPassword=document.getElementById("password").value,confirmPassword=document.getElementById("confirm").value;if(newPassword!==confirmPassword){msg.className="message error";msg.textContent="Passwords do not match.";return}b.disabled=true;try{const r=await fetch(API+"/api/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,newPassword,confirmPassword})}),d=await r.json();if(!r.ok||!d.success){msg.className="message error";msg.textContent=d.message||"Could not reset your password.";return}msg.className="message success";msg.textContent="Password updated. You can now sign in.";form.hidden=true;statusEl.textContent="Password reset complete."}catch(e){msg.className="message error";msg.textContent="Network error. Please try again"}finally{b.disabled=false}});
</script></body></html>
