<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<style>
*{box-sizing:border-box}body{background:#050816;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}.box{width:min(100%,390px);padding:30px;background:rgba(255,255,255,.05);border-radius:20px;text-align:center;border:1px solid #7c3aed}h2{color:#c084fc;margin:0 0 12px}p{color:#94a3b8;font-size:14px;line-height:1.5}input{width:100%;padding:13px;margin:8px 0;border:1px solid transparent;border-radius:10px;background:#1f2937;color:white;font-size:15px;outline:none}input:focus{border-color:#7c3aed}button{width:100%;padding:13px;margin-top:8px;background:linear-gradient(135deg,#7c3aed,#c084fc);border:0;border-radius:10px;color:white;font-weight:bold;font-size:15px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.message{margin-top:15px;padding:10px;border-radius:8px;font-size:14px;display:none}.message.error{display:block;background:rgba(255,77,109,.15);color:#ff6b81}.message.success{display:block;background:rgba(0,245,160,.15);color:#00f5a0}a{color:#c084fc;text-decoration:none}
</style>
</head>
<body>
<main class="box">
  <h2>Reset Password</h2>
  <p id="status">Checking your reset link…</p>
  <form id="resetForm" hidden>
    <input id="newPassword" type="password" minlength="6" autocomplete="new-password" placeholder="New password (at least 6 characters)" required>
    <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Confirm new password" required>
    <button id="submitBtn" type="submit">Update Password</button>
  </form>
  <div id="message" class="message" role="status"></div>
  <p><a href="login.html">← Back to Login</a></p>
</main>
<script>
const API_BASE = "https://ai-trading-system-j5jf.onrender.com";
const token = new URLSearchParams(location.search).get("token");
const statusEl = document.getElementById("status");
const form = document.getElementById("resetForm");
const messageEl = document.getElementById("message");
function showMessage(text, type){ messageEl.textContent = text; messageEl.className = `message ${type}`; }
(async function verifyLink(){
  if(!token){ statusEl.textContent = "This reset link is missing its token. Request a new one."; return; }
  try{
    const response = await fetch(`${API_BASE}/api/verify-reset-token?token=${encodeURIComponent(token)}`);
    const data = await response.json();
    if(!response.ok || !data.success){ statusEl.textContent = data.message || "This reset link is invalid or expired. Request a new one."; return; }
    statusEl.textContent = "Choose a new password for your account.";
    form.hidden = false;
  }catch(error){ statusEl.textContent = "Could not verify this link. Please try again."; }
})();
form.addEventListener("submit", async event => {
  event.preventDefault();
  const button = document.getElementById("submitBtn");
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  if(newPassword !== confirmPassword){ showMessage("Passwords do not match.", "error"); return; }
  button.disabled = true;
  try{
    const response = await fetch(`${API_BASE}/api/reset-password`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({token,newPassword,confirmPassword}) });
    const data = await response.json();
    if(!response.ok || !data.success){ showMessage(data.message || "Could not reset your password.", "error"); return; }
    showMessage("Password updated. You can now sign in.", "success");
    form.hidden = true;
    statusEl.textContent = "Password reset complete.";
  }catch(error){ showMessage("Network error. Please try again.", "error"); }
  finally{ button.disabled = false; }
});
</script>
</body>
</html>
